name: Deploy to tools.mspi.io

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate .env
        run: |
          mkdir -p backend/dist
          cat > backend/dist/.env << EOF
          ALLOWED_EMAIL_DOMAINS=mspi.io,mobilecare.com,powermaccenter.com
          COOKIE_DOMAIN=.mspi.io
          NODE_ENV=production
          FRONTEND_URL=https://tools.mspi.io
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          EOF

      - name: Archive repo for Hostinger
        run: |
          zip -r /tmp/deploy.zip . \
            -x "node_modules/*" \
            -x "backend/node_modules/*" \
            -x "frontend/node_modules/*" \
            -x ".git/*" \
            -x ".git"

      - name: Deploy to Hostinger
        run: |
          echo "=== Uploading archive to Hostinger ==="
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.HOSTINGER_API_TOKEN }}" \
            -F "archive=@/tmp/deploy.zip" \
            -F "app_type=other" \
            -F "node_version=22" \
            "https://developers.hostinger.com/api/hosting/v1/accounts/${{ secrets.HOSTINGER_ACCOUNT_ID }}/websites/${{ secrets.HOSTINGER_DOMAIN }}/nodejs/builds/from-archive"
          echo ""
          echo "=== Done ==="

      - name: Verify site is healthy
        run: |
          for i in $(seq 1 12); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" https://tools.mspi.io/api/health)
            echo "Attempt $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "=== Site is healthy ==="
              exit 0
            fi
            sleep 10
          done
          echo "=== Site failed to become healthy ==="
          exit 1
