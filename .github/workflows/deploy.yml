name: Deploy to tools.mspi.io

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and build application
        run: |
          npm ci --ignore-scripts
          npm --prefix backend ci --include=dev --ignore-scripts
          npm --prefix backend run build
          npm --prefix frontend ci --include=dev --ignore-scripts
          npm --prefix frontend run build
          node -e "require('fs').cpSync('frontend/dist', 'backend/dist/public', { recursive: true })"

      - name: Generate .env
        run: |
          mkdir -p backend/dist
          cat > backend/dist/.env << EOF
          ALLOWED_EMAIL_DOMAINS=mspi.io,mobilecare.com,powermaccenter.com
          COOKIE_DOMAIN=.mspi.io
          NODE_ENV=production
          FRONTEND_URL=https://tools.mspi.io
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          EOF

      - name: Archive repo for Hostinger
        run: |
          zip -r /tmp/deploy.zip . \
            -x "node_modules/*" \
            -x "backend/node_modules/*" \
            -x "frontend/node_modules/*" \
            -x ".git/*" \
            -x ".git"

      - name: Deploy to Hostinger
        run: |
          echo "=== Uploading archive to Hostinger ==="
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.HOSTINGER_API_TOKEN }}" \
            -F "archive=@/tmp/deploy.zip" \
            -F "app_type=other" \
            -F "node_version=22" \
            "https://developers.hostinger.com/api/hosting/v1/accounts/${{ secrets.HOSTINGER_ACCOUNT_ID }}/websites/${{ secrets.HOSTINGER_DOMAIN }}/nodejs/builds/from-archive"
          echo ""
          echo "=== Done ==="
