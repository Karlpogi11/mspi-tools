name: Verify tools.mspi.io health

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: tools-mspi-health
  cancel-in-progress: true

jobs:
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Audit backend dependencies
        working-directory: backend
        run: npm audit --audit-level=high

  verify-health:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for app and restart if down
        env:
          TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          USERNAME: ${{ secrets.HOSTINGER_USERNAME }}
          DOMAIN: ${{ secrets.HOSTINGER_DOMAIN }}
          URL: https://tools.mspi.io
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          API="https://developers.hostinger.com/api/hosting/v1/accounts/${USERNAME}/websites/${DOMAIN}/nodejs"
          health() { curl --max-time 10 -s -o /dev/null -w "%{http_code}" "$URL/api/health"; }
          latest_build_state() {
            curl --max-time 15 --fail-with-body -sS \
              -H "Authorization: Bearer $TOKEN" "$API/builds" \
              | jq -r '.data[0].state // "unknown"'
          }
          wait_for_healthy() {
            local attempts="$1"
            local consecutive=0
            for i in $(seq 1 "$attempts"); do
              CODE=$(health)
              echo "[$i] health: $CODE"
              if [ "$CODE" = "200" ]; then
                consecutive=$((consecutive + 1))
                [ "$consecutive" -ge 3 ] && return 0
              else
                consecutive=0
              fi
              sleep 10
            done
            return 1
          }
          wait_for_active_build() {
            local attempts="$1"
            for i in $(seq 1 "$attempts"); do
              STATE=$(latest_build_state || echo "unknown")
              CODE=$(health)
              echo "[$i] build: $STATE; health: $CODE"
              if [ "$CODE" = "200" ]; then
                echo "=== Healthy while deployment is finishing ==="
                return 0
              fi
              case "$STATE" in
                pending|running) sleep 10 ;;
                completed) return 0 ;;
                *)
                  echo "=== Deployment state is $STATE ==="
                  return 0
                  ;;
              esac
            done
            echo "=== Deployment did not finish in time ==="
            return 1
          }
          if [ "$EVENT_NAME" = "push" ]; then
            # Hostinger starts Git builds shortly after the GitHub push event.
            # Do not mark the old app healthy before that deployment is visible.
            echo "=== Allowing the Hostinger deployment to start ==="
            sleep 30
          fi
          echo "=== Waiting for app to become healthy ==="
          if wait_for_healthy 3; then echo "=== Healthy ==="; exit 0; fi
          STATE=$(latest_build_state || echo "unknown")
          if [ "$STATE" = "pending" ] || [ "$STATE" = "running" ]; then
            echo "=== Hostinger deployment is $STATE; waiting before any restart ==="
            if ! wait_for_active_build 30; then
              exit 1
            fi
            echo "=== Checking the freshly deployed app ==="
            if wait_for_healthy 12; then echo "=== Healthy after deployment ==="; exit 0; fi
          fi
          echo "=== App unhealthy, restarting Node.js server ==="
          curl --fail-with-body -sS -w "\nrestart HTTP %{http_code}\n" \
            -X POST -H "Authorization: Bearer $TOKEN" "$API/server/restart"
          echo "=== Waiting after restart ==="
          if wait_for_healthy 18; then echo "=== Healthy after restart ==="; exit 0; fi
          echo "=== Site failed to recover ==="
          exit 1
